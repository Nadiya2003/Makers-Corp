name: Makers-Ceylon deploy 

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "SERVER_PATH='${{ secrets.WORK_DIR }}' \
           REPO_URL='git@github.com:Nadiya2003/Makers-Ceylon.git' \
           MONGO_URI='${{ secrets.MONGO_URI }}' \
           PORT='${{ vars.PORT }}' \
           FRONTEND_URL='${{ vars.FRONTEND_URL }}' \
           bash -s" << 'EOF'
            set -e
            echo "--- Starting Deployment ---"

            TEMP_CLONE_DIR="/tmp/makersceylon-$(date +%s)"
            echo "Cloning repository into $TEMP_CLONE_DIR..."
            git clone "$REPO_URL" "$TEMP_CLONE_DIR"

            # Backup persistent uploads before replacing code
            UPLOADS_BACKUP_DIR="/tmp/makers-uploads-backup-$(date +%s)"
            UPLOADS_PATH="$SERVER_PATH/Ceylon_backend/public/uploads"

            echo "Backing up uploads folder..."
            if [ -d "$UPLOADS_PATH" ]; then
              mkdir -p "$UPLOADS_BACKUP_DIR"
              cp -a "$UPLOADS_PATH" "$UPLOADS_BACKUP_DIR/uploads"
              echo "Uploads backed up successfully."
            else
              echo "No existing uploads folder found. Creating fresh one later."
            fi

            echo "Updating application code in $SERVER_PATH..."
            rm -rf "$SERVER_PATH"
            mkdir -p "$SERVER_PATH"
            mv "$TEMP_CLONE_DIR"/* "$SERVER_PATH/"
            rm -rf "$TEMP_CLONE_DIR"

            # Restore persistent uploads after replacing code
            echo "Restoring uploads folder..."
            mkdir -p "$SERVER_PATH/public"

            if [ -d "$UPLOADS_BACKUP_DIR/uploads" ]; then
              rm -rf "$SERVER_PATH/Ceylon_backend/public/uploads"
              mv "$UPLOADS_BACKUP_DIR/uploads" "$SERVER_PATH/Ceylon_backend/public/uploads"
              rm -rf "$UPLOADS_BACKUP_DIR"
              echo "Uploads restored successfully."
            else
              mkdir -p "$SERVER_PATH/Ceylon_backend/public/uploads"
              echo "Fresh uploads folder created."
            fi

            cd "$SERVER_PATH/Ceylon_frontend"

            echo "Writing .env file..."
            echo "NEXT_PUBLIC_API_URL=https://makersceylon.com/api" | base64 -d > .env

            echo "Installing dependencies..."
            npm install

            echo "Building Next.js app..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart makers-frontend || pm2 start npm --name "makers-frontend" -- start
            pm2 save

            cd "$SERVER_PATH/Ceylon_backend"
            
            yarn install --production=false
            echo "Building the application..."
            echo "Writing backend .env..."
            {
                echo "MONGO_URI=$(echo "$MONGO_URI" | base64 -d)"
                echo "PORT=$(echo "$PORT" | base64 -d)"
                echo "FRONTEND_URL=$(echo "$FRONTEND_URL" | base64 -d)"
            } > .env
            chmod 600 .env
            pm2 describe makers-backend >/dev/null 2>&1 && pm2 restart authenticweb-backend --update-env || pm2 start npm --name makers-backend -- start
            pm2 save
            # rm -f .env .env.production

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "--- Deployment Finished Successfully ---"
            pm2 status
          EOF
