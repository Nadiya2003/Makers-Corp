name: Makers-Ceylon deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Setup SSH Key
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || echo "keyscan warning: verify server key manually if needed"
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SERVER_PATH: ${{ secrets.WORK_DIR }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PORT: ${{ vars.PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          RESEND_API: ${{ secrets.RESEND_API }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          RECEIVE_EMAIL: ${{ vars.RECEIVE_EMAIL }}
          SEND_EMAIL: ${{ vars.SEND_EMAIL }}
        run: |
          set -euo pipefail

          ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "SERVER_PATH='$SERVER_PATH' \
             REPO_URL='git@github.com:Nadiya2003/Makers-Ceylon.git' \
             MONGO_URI='$MONGO_URI' \
             PORT='$PORT' \
             FRONTEND_PORT='$FRONTEND_PORT' \
             FRONTEND_URL='$FRONTEND_URL' \
             RESEND_API='$RESEND_API' \
             CLOUDINARY_URL='$CLOUDINARY_URL' \
             RECEIVE_EMAIL='$RECEIVE_EMAIL' \
             SEND_EMAIL='$SEND_EMAIL' \
             bash -s" << 'EOF'
            set -euo pipefail
            echo "--- Starting Deployment ---"

            # Ensure GitHub host key is trusted on the target server
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts

            UPLOADS_PATH="$SERVER_PATH/Ceylon_backend/public/uploads"
            TS="$(date +%s)"
            UPLOADS_BACKUP_DIR="/tmp/makers-uploads-backup-$TS"

            # ── 1. Backup uploads to a SAFE location outside SERVER_PATH ──
            echo "Backing up uploads folder..."
            if [ -d "$UPLOADS_PATH" ]; then
              mkdir -p "$UPLOADS_BACKUP_DIR"
              cp -a "$UPLOADS_PATH/." "$UPLOADS_BACKUP_DIR/"
              echo "Uploads backed up to $UPLOADS_BACKUP_DIR ($(ls "$UPLOADS_BACKUP_DIR" | wc -l) files)"
            else
              echo "No existing uploads folder found. Will create fresh one."
            fi

            # ── 2. Clone repo to temp dir ──
            TEMP_CLONE_DIR="/tmp/makersceylon-$TS"
            echo "Cloning repository into $TEMP_CLONE_DIR..."
            git clone --depth 1 "$REPO_URL" "$TEMP_CLONE_DIR"

            # ── 3. Swap code ──
            echo "Updating application code in $SERVER_PATH..."
            rm -rf "$SERVER_PATH"
            mkdir -p "$SERVER_PATH"
            
            shopt -s dotglob
            mv "$TEMP_CLONE_DIR"/* "$SERVER_PATH/"
            shopt -u dotglob
            rm -rf "$TEMP_CLONE_DIR"

            # ── 4. Restore uploads into correct path ──
            echo "Restoring uploads folder..."
            mkdir -p "$UPLOADS_PATH"
            if [ -d "$UPLOADS_BACKUP_DIR" ]; then
              cp -a "$UPLOADS_BACKUP_DIR/." "$UPLOADS_PATH/"
              rm -rf "$UPLOADS_BACKUP_DIR"
              echo "Uploads restored successfully ($(ls "$UPLOADS_PATH" | wc -l) files)"
            else
              echo "Fresh uploads folder created at $UPLOADS_PATH"
            fi

            # ── 5. Frontend ──
            cd "$SERVER_PATH/Ceylon_frontend"
            echo "Writing frontend .env file..."
            {
              echo "PORT=$FRONTEND_PORT"
              echo "NEXT_PUBLIC_API_URL=https://makersceylon.com/api"
            } > .env
            echo "Installing frontend dependencies..."
            npm install
            echo "Building Next.js app..."
            npm run build
            echo "Restarting frontend PM2 on port $FRONTEND_PORT..."
            pm2 describe makers-frontend >/dev/null 2>&1 \
              && pm2 restart makers-frontend --update-env \
              || pm2 start npm --name "makers-frontend" -- start -- -p "$FRONTEND_PORT"
            pm2 save

            # ── 6. Backend ──
            cd "$SERVER_PATH/Ceylon_backend"
            echo "Installing backend dependencies..."
            npm install --production=false
            echo "Writing backend .env..."
            {
                echo "MONGO_URI=$MONGO_URI"
                echo "PORT=$PORT"
                echo "FRONTEND_URL=$FRONTEND_URL"
                echo "RESEND_API=$RESEND_API"
                echo "CLOUDINARY_URL=$CLOUDINARY_URL"
                echo "RECEIVE_EMAIL=$RECEIVE_EMAIL"
                echo "SEND_EMAIL=$SEND_EMAIL"
            } > .env
            chmod 600 .env
            echo "Restarting backend PM2 on port $PORT..."
            pm2 describe makers-backend >/dev/null 2>&1 \
              && pm2 restart makers-backend --update-env \
              || pm2 start npm --name makers-backend -- start
            pm2 save

            echo "--- Deployment Finished Successfully ---"
            pm2 status
          EOF
